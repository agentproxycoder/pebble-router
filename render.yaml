services:
  - type: web
    name: pebble-router
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: INDEX_WEBHOOK_SECRET
        sync: false
      - key: ROUTINE_FIRE_URL
        sync: false
      - key: ROUTINE_TOKEN
        sync: false
